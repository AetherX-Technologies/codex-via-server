name: integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  disposable-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run disposable server integration
        run: bash integration/run.sh
