name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Audit test dependencies
        run: npm audit --audit-level=moderate

      - name: Validate shared contracts
        run: npm run test:contracts

      - name: Run macOS tests
        if: runner.os == 'macOS'
        run: bash tests/test.sh

      - name: Run Windows contract checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./windows/tests/Test-RepositoryContracts.ps1

      - name: Install pinned Pester
        if: runner.os == 'Windows'
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run Windows setup and enrollment tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = './windows/tests/Setup.Tests.ps1'
          $configuration.Run.PassThru = $true
          $configuration.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $configuration
          if ($result.FailedCount -gt 0) {
            foreach ($failed in $result.Failed) {
              $message = ($failed.ErrorRecord | Out-String).Replace("`r", ' ').Replace("`n", ' ')
              Write-Output "::error file=windows/tests/Setup.Tests.ps1,title=$($failed.Name)::$message"
            }
            exit 1
          }
