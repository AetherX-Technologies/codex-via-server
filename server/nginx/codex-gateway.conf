server {
    listen 127.0.0.1:18319;
    server_name _;

    access_log /var/log/nginx/codex-via-server-access.log combined;
    error_log /var/log/nginx/codex-via-server-error.log warn;

    client_max_body_size 32m;
    server_tokens off;

    location = /healthz {
        access_log off;
        return 204;
    }

    location ^~ /v1/ {
        include /etc/codex-via-server/gateway-secret.conf;

        proxy_pass http://127.0.0.1:8317;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_intercept_errors off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        return 404;
    }
}
